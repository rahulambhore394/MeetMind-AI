# Production Configuration
server.port=${PORT:8080}
spring.data.redis.repositories.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.data.redis.host=${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${SPRING_KAFKA_AUTO_STARTUP:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.health.kafka.enabled=false
management.health.redis.enabled=false
management.metrics.export.prometheus.enabled=true
