# Production Configuration
server.port=${PORT:8080}
spring.data.redis.repositories.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Multipart / File Uploads for Meeting Recordings
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.data.redis.host=${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}

spring.kafka.enabled=${SPRING_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${SPRING_KAFKA_AUTO_STARTUP:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.health.kafka.enabled=false
management.health.redis.enabled=false
management.metrics.export.prometheus.enabled=true

# Email (SMTP) Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.address=${MAIL_FROM_ADDRESS:noreply@meetmind.ai}
mail.from.name=${MAIL_FROM_NAME:MeetMind AI}
mail.replyto.address=${MAIL_REPLYTO_ADDRESS:noreply@meetmind.ai}

