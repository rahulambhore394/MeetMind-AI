spring.application.name=meetmind-backend
server.port=${PORT:8080}
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.kafka.KafkaHealthContributorAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetmind}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2005}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.kafka.enabled=false
management.health.redis.enabled=false
management.health.binders.enabled=false

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:4lFDPaatXYbxc5nObM7KN1xtycTt+wV5jQcUG0RYnfM=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Redis Connection
# ===============================
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.enabled=${SPRING_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${SPRING_KAFKA_AUTO_STARTUP:false}

# Producer Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.meetmind.meetmind_backend.event,com.meetmind.meetmind_backend.transcription,com.meetmind.meetmind_backend.intelligence,com.meetmind.meetmind_backend.representative
spring.kafka.consumer.auto-offset-reset=earliest

# ===============================
# WebRTC Configuration
# ===============================
webrtc.ice-servers[0].urls=stun:stun.l.google.com:19302
webrtc.ice-servers[1].urls=stun:stun1.l.google.com:19302
webrtc.ice-servers[2].urls=stun:stun2.l.google.com:19302

# ===============================
# Transcription Configuration
# ===============================
transcription.provider=vosk
transcription.vosk.model-path.en=models/vosk/en
transcription.vosk.model-path.hi=models/vosk/hi
transcription.vosk.model-path.mr=models/vosk/mr

# ===============================
# Translation Configuration
# ===============================
translation.provider=local
translation.supported-languages=en,hi,mr

# ===============================
# AI Intelligence Configuration
# ===============================
intelligence.provider=local
intelligence.supported-languages=en,hi,mr